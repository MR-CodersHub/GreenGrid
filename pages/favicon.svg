<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <linearGradient id="gg-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F4A300"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="14" fill="url(#gg-bg)"/>

  <!-- Subtle solar grid lines -->
  <path d="M12 32h40M32 12v40M18 18l28 28M18 46l28-28" stroke="#40916C" stroke-width="1.2" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- Sun Rays -->
  <g stroke="url(#gg-sun)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <line x1="32" y1="9" x2="32" y2="15"/>
    <line x1="32" y1="49" x2="32" y2="55"/>
    <line x1="9" y1="32" x2="15" y2="32"/>
    <line x1="49" y1="32" x2="55" y2="32"/>
    <line x1="15.7" y1="15.7" x2="20" y2="20"/>
    <line x1="44" y1="44" x2="48.3" y2="48.3"/>
    <line x1="48.3" y1="15.7" x2="44" y2="20"/>
    <line x1="20" y1="44" x2="15.7" y2="48.3"/>
  </g>

  <!-- Sun Center Core -->
  <circle cx="32" cy="32" r="11" fill="url(#gg-sun)" filter="url(#glow)"/>

  <!-- Solar Leaf / Grid Spark Accent -->
  <path d="M32 26c3.3 0 6 2.7 6 6 0 3.3-2.7 6-6 6s-6-2.7-6-6c0-3.3 2.7-6 6-6z" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="28.5" cy="28.5" r="2.5" fill="#FFFFFF" fill-opacity="0.75"/>
</svg>
